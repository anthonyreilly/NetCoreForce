name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

# build and test only - no write access needed
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      config: "Release"
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET Core 8.0
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Setup .NET Core 9.0
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Setup .NET Core 10.0
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration $config --no-restore

      - name: Test net8.0
        id: test-net8_0
        continue-on-error: false
        run: dotnet test src/NetCoreForce.Client.Tests --configuration $config --no-restore --no-build --verbosity normal --framework net8.0

      - name: Test net9.0
        id: test-net9_0
        continue-on-error: false
        run: dotnet test src/NetCoreForce.Client.Tests --configuration $config --no-restore --no-build --verbosity normal --framework net9.0

      - name: Test net10.0
        id: test-net10_0
        continue-on-error: false
        run: dotnet test src/NetCoreForce.Client.Tests --configuration $config --no-restore --no-build --verbosity normal --framework net10.0

      - name: Test net462
        id: test-net462
        continue-on-error: false
        run: dotnet test src/NetCoreForce.Client.Tests --configuration $config --no-restore --no-build --verbosity normal --framework net462

      - name: Test net472
        id: test-net472
        continue-on-error: false
        run: dotnet test src/NetCoreForce.Client.Tests --configuration $config --no-restore --no-build --verbosity normal --framework net472

      - name: Test net48
        id: test-net48
        continue-on-error: false
        run: dotnet test src/NetCoreForce.Client.Tests --configuration $config --no-restore --no-build --verbosity normal --framework net48

      - name: Test net481
        id: test-net481
        continue-on-error: false
        run: dotnet test src/NetCoreForce.Client.Tests --configuration $config --no-restore --no-build --verbosity normal --framework net481

      - name: Upload nuget artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuget-package
          path: ${{github.workspace}}/packages/NetCoreForce.*.nupkg
