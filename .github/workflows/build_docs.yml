name: Build_Docs

on:
  push:
    branches:
      # - main
      - docfx
  pull_request:
    branches:
      # - main
      - docfx
  workflow_dispatch:

# least privilege by default - only the deploy job gets Pages permissions
permissions:
  contents: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-docs:
    runs-on: ubuntu-latest

    env:
      config: "Release"

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Dotnet Setup
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.x

    # pinned, so a new docfx release can't change what runs in this workflow
    - name: Install docfx
      run: dotnet tool update -g docfx --version 2.81.0

    - name: Build DocFX 'src/docs/_site'
      run: docfx docfx.json

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v5
      with:
        # Upload entire repository
        path: 'docs/_site'

  # pull requests only build the docs - deploying to GitHub Pages only happens for pushes and manual runs
  deploy-docs:
    needs: build-docs
    if: github.event_name != 'pull_request'

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
